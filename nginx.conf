# bkmrklparsesave — NGINX site template.
# Rendered by install.sh into sites-available/bkmrklparsesave (or conf.d).
# Only reverse-proxies to the Python server; never serves files from disk.
server {
    listen ${NGINX_BIND}:${NGINX_PORT};
    server_name ${SERVER_NAME};

    # 5 MB body limit on the server, a little headroom on the proxy.
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:${APP_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
